# ── 爬蟲搜尋詞（各來源用這些詞去查） ──────────────
search_terms:
  - "marketing operations"
  - "coordinateur marketing"
  - "acquisition marketing"
  - "traffic manager"
  - "CRM marketing"
  - "chef de projet CRM"
  - "data analyst marketing"
  - "web analyst"
  - "marketing produit"
  - "product marketing"
  - "marketing automation"
  # Customer 職類（英法兩種講法）
  - "customer marketing"
  - "customer success"
  - "marketing clientèle"
  # 以下是較寬的詞，刻意放最後：各來源有時間預算，萬一不夠用，被跳過的會是這些，
  # 上面核心的行銷詞照常跑完。英法兩種講法都列（CRM、mandarin 兩語同字）。
  # 搜到的職缺照樣要過分類：只有明確要求中文的才能不屬於任何職類也收（見 bonus_tags.chinese）。
  - "CRM"
  - "mandarin"
  - "chinese"
  - "chinois"
  # international／anglais／english 只會「掛標籤」、不會讓職缺入庫，單獨搜會撈回幾乎
  # 所有法國職缺再整批丟掉，所以搭 marketing 一起搜，撈到的才是行銷職缺。
  - "marketing international"
  - "international marketing"
  - "marketing anglais"
  - "english marketing"
