      - "charge des operations marketing"
      - "chargee des operations marketing"
      - "coordinateur marketing"
      - "coordinatrice marketing"
      - "marketing operations"
      - "marketing ops"
    # 描述命中 → 加分（每個 +2，上限 +10）
    skill_keywords:
      - "automation"
      - "processus"
      - "workflow"
      - "gestion de projet"
      - "outils marketing"
      - "hubspot"
      - "salesforce"
      - "zapier"

  performance_marketing:
    label: "Performance Marketing"
    title_keywords:
      - "charge d'acquisition"
      - "chargee d'acquisition"
      - "charge acquisition"
      - "traffic manager"
      - "specialiste seo"
      - "specialiste sea"
      - "performance marketing"
      - "growth marketing"
    skill_keywords:
      - "roi"
      - "roas"
      - "conversion"
      - "kpi"
      - "a/b testing"
      - "ab testing"
      - "tracking"
      - "seo"
      - "sea"
      - "google ads"
      - "meta ads"
      - "acquisition"
      - "trafic"

  crm:
