# Jo's Chasse — 關鍵字設定檔
# 改這個檔案就能調整分類與排序，不用動程式。
# 所有比對都是「不分大小寫、不分重音」(chargé == charge)。

categories:
  marketing_operations:
    label: "Marketing Operations"
    # 職稱命中 → 歸入此類
    title_keywords:
      - "charge des operations marketing"
      - "chargee des operations marketing"
      - "coordinateur marketing"
      - "coordinatrice marketing"
      - "marketing operations"
      - "marketing ops"
    # 描述命中 → 加分（每個 +2，上限 +10）
    skill_keywords:
      - "automation"
      - "processus"
      - "workflow"
      - "gestion de projet"
      - "outils marketing"
      - "hubspot"
      - "salesforce"
      - "zapier"

  performance_marketing:
    label: "Performance Marketing"
    title_keywords:
      - "charge d'acquisition"
      - "chargee d'acquisition"
      - "charge acquisition"
      - "traffic manager"
      - "specialiste seo"
      - "specialiste sea"
      - "performance marketing"
      - "growth marketing"
    skill_keywords:
      - "roi"
      - "roas"
      - "conversion"
      - "kpi"
      - "a/b testing"
      - "ab testing"
      - "tracking"
      - "seo"
      - "sea"
      - "google ads"
      - "meta ads"
      - "acquisition"
      - "trafic"

  crm:
    label: "CRM"
    title_keywords:
      - "charge de crm"
      - "chargee de crm"
      - "charge crm"
      - "chef de projet crm"
      - "crm specialist"
      - "crm manager"
      - "responsable crm"
    skill_keywords:
      - "fidelisation"
      - "emailing"
      - "parcours client"
      - "segmentation"
      - "base de donnees"
      - "newsletter"
      - "marketing automation"

  # 以客戶為中心的職缺：Customer Marketing / Success / Experience…
  # 刻意不收 customer service / support / care 與 relation client、service client——
  # 那多半是客服中心的缺，而 anglais、english 這類搜尋詞正好會撈到一大堆。
  customer:
    label: "Customer"
    # 只看職稱、不用描述補判：customer experience、expérience client 這類詞在一般
    # 行銷職缺的描述裡太常見，補判會讓大半職缺都掛上 Customer，篩選就沒意義了。
    title_only: true
    title_keywords:
      - "customer marketing"
      - "customer success"
      - "customer experience"
      - "customer engagement"
      - "customer lifecycle"
      - "customer retention"
      - "customer insight"
      - "customer journey"
      - "marketing client"     # 也涵蓋 marketing clientèle
      - "experience client"
      - "engagement client"
      - "parcours client"
      - "connaissance client"
    skill_keywords:
      - "nps"
      - "csat"
      - "churn"
      - "retention"
      - "satisfaction client"
      - "customer satisfaction"
      - "voix du client"
      - "voice of the customer"
      - "upsell"
      - "cross-sell"
      - "zendesk"

  marketing_analytics:
    label: "Marketing Analytics"
    title_keywords:
      - "data analyst marketing"
      - "marketing data analyst"
      - "web analyst"
      - "analyste marketing"
      - "marketing analytics"
    skill_keywords:
      - "sql"
      - "tableau"
      - "google analytics"
      - "ga4"
      - "data visualization"
      - "dataviz"
      - "reporting"
      - "dashboard"
      - "analyse de donnees"

  marketing_produit:
    label: "Marketing Produit"
    title_keywords:
      - "charge de marketing produit"
      - "chargee de marketing produit"
      - "marketing produit"
      - "chef de produit"
      - "product marketing"
    skill_keywords:
      - "lancement de produit"
      - "go-to-market"
      - "gtm"
      - "roadmap"
      - "etude de marche"
      - "veille concurrentielle"
      - "positionnement"

# 跨類技能標籤：不成類，但命中會在職缺上顯示標籤（Yen 的加分技能）
# 比對範圍是職稱＋描述。標籤只負責標示，唯一的例外是 keep_keywords（見中文/國際）。
bonus_tags:
  video_content:
    label: "影音內容"
    skill_keywords:
      - "creation video"
      - "montage video"
      - "contenu digital"

  # 中文／國際：Yen 的語言與國際背景是優勢的職缺。
  # key 維持 "chinese"（舊名「需中文」）：既有的 jobs.json 與瀏覽器裡的封存快照都用這個 key。
  #
  # 兩組關鍵字，效果不同：
  # - keep_keywords：明確要求中文。命中就收，即使六類都沒中——中文是最大的優勢，
  #   非行銷職缺也值得看。
  # - skill_keywords：國際環境、英文、中國市場。只掛標籤，職缺本身仍須屬於六類之一；
  #   anglais 幾乎每個職缺都會提，這組若也能讓職缺入庫，整個網站會被灌爆。
  #
  # keep_keywords 刻意不收單獨的 "chinois"／"chinese"：法文的「中國的」與「中文」同字，
  # "marché chinois"（中國市場）、"restaurant chinois" 都不代表要會中文。模糊的字一律
  # 搭語言講法才算；mandarin、中文、HSK 這些只可能指語言的字才單獨成立。
  # 單獨的 chinois／chinese 放在 skill_keywords：中國市場本來就算「國際」。
  chinese:
    label: "中文/國際"
    keep_keywords:
      # 只可能指語言的字
      - "mandarin"
      - "cantonais"
      - "cantonese"
      - "sinophone"
      - "hsk"
      - "中文"
      - "華語"
      - "华语"
      - "普通話"
      - "普通话"
      - "國語"
      - "国语"
      # 英文："chinese" 搭語言講法
      - "chinese speaker"     # 也涵蓋 chinese speakers
      - "chinese speaking"
      - "chinese-speaking"
      - "speak chinese"
      - "speaks chinese"
      - "fluent in chinese"
      - "fluent chinese"
      - "chinese fluent"
      - "native chinese"
      - "chinese native"
      - "proficient in chinese"
      - "proficiency in chinese"
      - "chinese language"
      - "spoken chinese"
      - "written chinese"
      - "business chinese"
      - "bilingual chinese"
      - "english and chinese"
      - "chinese and english"
      - "english/chinese"
      - "chinese/english"
      # 法文："chinois" 搭語言講法
      - "chinois courant"
      - "courant en chinois"
      - "bilingue chinois"
      - "parle chinois"
      - "parlez chinois"
      - "parlant chinois"
      - "parler chinois"
      - "parlez le chinois"
      - "parler le chinois"
      - "maitrise du chinois"
      - "maitrisez le chinois"
      - "niveau de chinois"
      - "connaissance du chinois"
      - "langue chinoise"
      - "chinois natif"
      - "chinois obligatoire"
      - "chinois exige"
      - "chinois requis"
      - "chinois indispensable"
      - "chinois souhaite"
      - "chinois apprecie"
      - "chinois ecrit"
      - "chinois lu"
      - "chinois serait un plus"
      - "chinois est un plus"
      - "chinois est un atout"
      - "anglais/chinois"
      - "anglais / chinois"
      - "anglais et chinois"
      - "anglais-chinois"
      - "chinois/anglais"
      - "chinois et anglais"
      - "francais/chinois"
      - "francais-chinois"
      - "francais et chinois"
      - "chinois/francais"
      - "chinois et francais"
    skill_keywords:
      - "international"       # 也涵蓋 internationale(s)
      - "internationaux"
      - "anglais"             # 也涵蓋 anglaise(s)
      - "anglophone"
      - "english"
      - "chinese"
      - "chinois"             # 也涵蓋 chinoise(s)
    # 比對前先從文字裡刪掉的片語：含有上面的字，但跟中文／國際無關
    ignore_phrases:
      - "mandarin oriental"   # 巴黎的飯店集團，旗下職缺描述幾乎都會寫到
      - "mandarine"           # 橘子；也是公司名（Mandarine Gestion…）
      - "nouvel an chinois"   # 零售行銷的檔期，不是國際業務
      - "chinese new year"
      - "cle anglaise"        # clé anglaise＝扳手

exclude_title:
  - "stage"
  - "stagiaire"
  - "alternance"
  - "alternant"
  - "alternante"
  - "apprenti"
  - "apprentissage"
  - "internship"
  # 採購職：法文職缺常寫成「Acheteur / Chef de Produit」，是採購不是行銷
  - "acheteur"
  - "acheteuse"

# 硬性排除（整字比對）：實習／建教的縮寫寫法，例如「Stg - Assistant...」「Alt - Chargé...」。
# 這些要整字比對，不能像 exclude_title 那樣用子字串——"alt" 會誤殺一堆正常字。
exclude_title_abbrev:
  - "stg"
  - "alt"
  - "stag"
  - "appr"   # 不要用 "app"：會誤殺 App Marketing Manager 這類正當職缺

# 硬性排除：職稱明顯針對其他國家市場（法國公司常替海外市場開缺、掛在巴黎辦公室下，
# 會騙過來源端的國家過濾；職稱含非法國國旗 emoji 也會被程式自動排除）
exclude_title_foreign:
  - "germany"
  - "deutschland"
  - "allemagne"
  - "italy"
  - "italia"
  - "italie"
  - "spain"
  - "espana"
  - "espagne"
  - "portugal"
  - "netherlands"
  - "pays-bas"
  - "belgium"
  - "belgique"
  - "poland"
  - "pologne"
  - "switzerland"
  - "suisse"
  - "austria"
  - "autriche"
  - "united kingdom"
  - "uk"
  - "ireland"
  - "irlande"
  - "usa"
  - "united states"
  - "luxembourg"
  - "denmark"
  - "sweden"
  - "norway"
  - "dach"
  - "benelux"
  - "nordics"

# 職級加分（+6）：符合 Yen 目標職級
seniority_boost_title:
  - "junior"
  - "charge"      # chargé / chargée（去重音後）
  - "chargee"
  - "specialiste"
  - "specialist"
  - "coordinateur"
  - "coordinatrice"

# 資深降權（-8）：明顯不是目標職級
seniority_penalty_title:
  - "senior"
  - "head of"
  - "director"
  - "directeur"
  - "directrice"
  - "vp "
  - "confirme"    # confirmé

# 合約加分（+4）：職稱或描述命中 CDI/CDD/Intérim
contract_boost:
  - "cdi"
  - "cdd"
  - "interim"

# 西部城市加權（+10）：Yen 優先的法國西半邊
west_cities:
  - "bordeaux"
  - "nantes"
  - "rennes"
  - "angers"
  - "la rochelle"
  - "brest"
  - "tours"
  - "poitiers"
  - "niort"
  - "vannes"
  - "lorient"
  - "saint-nazaire"
  - "le mans"
  - "caen"
  - "bayonne"
  - "biarritz"
  - "anglet"
  - "pau"
  - "toulouse"
  - "limoges"

# Remote 加分（+6）；巴黎 +0；其他城市 +2
remote_boost: 6
west_boost: 10
other_city_boost: 2

# ── 爬蟲搜尋詞（各來源用這些詞去查） ──────────────
search_terms:
  - "marketing operations"
  - "coordinateur marketing"
  - "acquisition marketing"
  - "traffic manager"
  - "CRM marketing"
  - "chef de projet CRM"
  - "data analyst marketing"
  - "web analyst"
  - "marketing produit"
  - "product marketing"
  - "marketing automation"
  # 以下是較寬的詞，刻意放最後：各來源有時間預算，萬一不夠用，被跳過的會是這些，
  # 上面核心的行銷詞照常跑完。英法兩種講法都列（CRM、mandarin、international 兩語同字）。
  # 搜到的職缺照樣要過分類：只有明確要求中文的才能不屬於六類也收（見 bonus_tags.chinese）。
  - "CRM"
  - "mandarin"
  - "chinese"
  - "chinois"
  - "international"
  - "anglais"
  - "english"
