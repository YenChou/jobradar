    title_keywords:
      - "charge de crm"
      - "chargee de crm"
      - "charge crm"
      - "chef de projet crm"
      - "crm specialist"
      - "crm manager"
      - "responsable crm"
    skill_keywords:
      - "fidelisation"
      - "emailing"
      - "parcours client"
      - "segmentation"
      - "base de donnees"
      - "newsletter"
      - "marketing automation"

  # 以客戶為中心的職缺：Customer Marketing / Success / Experience…
  # 刻意不收 customer service / support / care 與 relation client、service client——
  # 那多半是客服中心的缺，而 anglais、english 這類搜尋詞正好會撈到一大堆。
  customer:
    label: "Customer"
    # 只看職稱、不用描述補判：customer experience、expérience client 這類詞在一般
    # 行銷職缺的描述裡太常見，補判會讓大半職缺都掛上 Customer，篩選就沒意義了。
    title_only: true
    # 職稱有這些字就不算 Customer：「Conseiller Expérience Client」「Customer Experience
    # Agent」是客服中心的缺。整字比對。
    exclude_title:
      - "conseiller"
      - "conseillere"
      - "teleconseiller"
      - "teleconseillere"
      - "agent"
      - "centre d'appels"
      - "call center"
      - "call centre"
      - "hotline"
    title_keywords:
      - "customer marketing"
      - "customer success"
      - "customer experience"
      - "customer engagement"
      - "customer lifecycle"
      - "customer retention"
      - "customer insight"
      - "customer journey"
      - "marketing client"     # 也涵蓋 marketing clientèle
      - "experience client"
      - "engagement client"
      - "parcours client"
      - "connaissance client"
    skill_keywords:
      - "nps"
      - "csat"
      - "churn"
      - "retention"
      - "satisfaction client"
      - "customer satisfaction"
      - "voix du client"
      - "voice of the customer"
      - "upsell"
      - "cross-sell"
      - "zendesk"

  marketing_analytics:
    label: "Marketing Analytics"
    title_keywords:
      - "data analyst marketing"
      - "marketing data analyst"
      - "web analyst"
      - "analyste marketing"
      - "marketing analytics"
    skill_keywords:
      - "sql"
      - "tableau"
      - "google analytics"
      - "ga4"
      - "data visualization"
      - "dataviz"
      - "reporting"
      - "dashboard"
      - "analyse de donnees"

  marketing_produit:
    label: "Marketing Produit"
    title_keywords:
      - "charge de marketing produit"
      - "chargee de marketing produit"
      - "marketing produit"
      - "chef de produit"
