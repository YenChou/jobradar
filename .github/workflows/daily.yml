name: Daily job scrape

on:
  schedule:
    - cron: "30 4 * * *"   # 每天 04:30 UTC = 巴黎 06:30（實際觸發可能延遲 10–30 分鐘）
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          HOURS_OLD: "72"
          RESULTS_PER_TERM: "100"
        run: python -m scraper.main

      - name: Commit updated jobs.json
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: daily scrape $(date -u +%F)"
          git push
