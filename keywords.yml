      - "go-to-market"
      - "gtm"
      - "roadmap"
      - "etude de marche"
      - "veille concurrentielle"
      - "positionnement"

# 跨類技能標籤：不成類，但命中會在職缺上顯示標籤（Yen 的加分技能）
# 比對範圍是職稱＋描述。標籤只負責標示，唯一的例外是 keep_keywords／keep_patterns（見需中文）。
bonus_tags:
  video_content:
    label: "影音內容"
    skill_keywords:
      - "creation video"
      - "montage video"
      - "contenu digital"

  # 需中文：明確要求中文能力的職缺。
  # 這組會影響「收不收」：命中就收，即使不屬於任何職類——中文是 Yen 最大的優勢，
  # 非行銷職缺也值得看。所以誤判的代價是把無關職缺放上網站，規則要嚴：
  # - keep_keywords 整字比對（前後不能接字母），"chinois lu" 不會中 "chinois lui"。
  # - 不收單獨的 chinois／chinese，也不收「chinois + 動詞」的片語（chinois souhaite、
  #   chinois exige…）：法文的「中國的」與「中文」同字，"nos clients chinois souhaitent"、
  #   "le marché chinois exige" 講的是中國客戶、市場。"français et chinois" 同理。
  # - 但「Chinois obligatoire」「Le chinois est un atout」「Anglais et chinois courants」是
  #   明確的語言要求，不能一起丟掉：交給 keep_patterns，只在能確定 chinois 是語言名詞時才收
  #   （前面直接接冠詞、在列點／子句開頭、或兩種語言並列且後面接 courant 之類的詞）。
  # - keep_patterns 是正規表示式，對象是去重音、轉小寫後的文字。
  chinese:
    label: "需中文"
    keep_keywords:
      # 只可能指語言的字
      - "mandarin"
      - "cantonais"
      - "cantonese"
      - "sinophone"
      - "hsk"                 # 後面接數字也算（HSK5）
      - "中文"
      - "華語"
      - "华语"
      - "普通話"
      - "普通话"
      - "國語"
      - "国语"
      # 英文："chinese" 搭語言講法
      - "chinese speaker"
      - "chinese speakers"
      - "chinese speaking"
      - "chinese-speaking"
      - "speak chinese"
      - "speaks chinese"
      - "fluent in chinese"
      - "fluent chinese"
      - "chinese fluent"
      - "native chinese"
      - "chinese native"
      - "proficient in chinese"
      - "proficiency in chinese"
      - "chinese language"
      - "spoken chinese"
      - "written chinese"
      - "business chinese"
      - "bilingual chinese"
      - "english/chinese"
      - "chinese/english"
      # 法文："chinois" 搭語言講法
      - "chinois courant"
      - "courant en chinois"
      - "bilingue chinois"
      - "parle chinois"
      - "parlez chinois"
      - "parlant chinois"
      - "parler chinois"
      - "parlez le chinois"
      - "parler le chinois"
      - "maitrise du chinois"
      - "maitrisez le chinois"
      - "niveau de chinois"
      - "connaissance du chinois"
      - "langue chinoise"
      - "chinois natif"
      - "anglais/chinois"
      - "anglais / chinois"
      - "anglais-chinois"
      - "chinois/anglais"
      - "francais/chinois"
      - "francais-chinois"
      - "chinois/francais"
    keep_patterns:
      # 「Langues : français, anglais, chinois」「Languages: English, Mandarin」
      - '\blang(ue|uage)s?( [a-z]+)? ?:[^.\n]{0,60}\b(chinois|chinese)\b'
      # 「Maîtrise de l'anglais et du chinois」「bonne connaissance de l'anglais et du chinois」
      - '\b(maitrise|maitrisez|connaissance|niveau|pratique)\b[^.\n]{0,40}\bdu chinois\b'
      # 以下都要能確定 chinois 指的是語言，才接「obligatoire、atout」這類詞。
      # 刻意不收「chinois + 動詞」（"clients chinois souhaitent"、"le marché chinois exige"）。
      # 冠詞直接接 chinois＝語言名詞：「Le chinois est un atout」「La maîtrise du chinois est requise」
      # （"le marché chinois exige" 中間隔著 marché，不會中）
      - '\b(le|du|en) chinois\b[^.\n]{0,30}\b(obligatoire|requise?|indispensable|exigee?|atout|plus|apprecie|souhaite|courant)\b'
      # 列點或子句開頭：「Chinois obligatoire」「* Chinois : courant」「Profil : chinois indispensable」
      # （"le visa chinois est obligatoire" 不在開頭，不會中）
      - '(^|[\n.:;,*(/-])\s*chinois( \([a-z ]+\))? ?:? ?(obligatoire|requis|indispensable|exige|souhaite|apprecie|courant|natif|lu|ecrit|parle|un plus|un atout|serait un plus|est un plus|est un atout)\b'
      # 兩種語言並列，後面要接「courant、obligatoire」這類詞才算：「Anglais et chinois courants」
      # （"partenaires français et chinois" 沒有後綴，不會中）
      - '\b(anglais|francais) et (du |le )?chinois (courants?|couramment|obligatoires?|requis|requise|indispensables?|exiges?|exigee|natifs?|parles?|ecrits?)\b'
      - '\bchinois et (l.)?(anglais|francais) (courants?|couramment|obligatoires?|requis|requise|indispensables?|exiges?|exigee|natifs?|parles?|ecrits?)\b'
      - '\bbilingues? ((anglais|francais) et chinois|chinois et (anglais|francais))\b'
      # 英文同理：「Fluent in English and Chinese」「Chinese and English required」
      - '\b(fluent|fluency|proficient|proficiency|native|bilingual)( in)? (english|french),? (and|&) chinese\b'
      - '\b((english|french) (and|&) chinese|chinese (and|&) (english|french)) (required|mandatory|fluent|speakers?|speaking|is required|is a must|is a plus)\b'
    ignore_phrases:
      - "mandarin oriental"   # 巴黎的飯店集團，旗下職缺描述幾乎都會寫到

  # 國際：國際環境、英文、中國市場。只掛標籤，不影響收不收——anglais 幾乎每個職缺都會提，
  # 若也能讓職缺入庫，整個網站會被灌爆。單獨的 chinois／chinese 放這裡：中國市場算國際。
  international:
    label: "國際"
    skill_keywords:
      - "international"       # 也涵蓋 internationale(s)
      - "internationaux"
      - "anglais"             # 也涵蓋 anglaise(s)
      - "anglophone"
      - "english"
      - "chinese"
      - "chinois"             # 也涵蓋 chinoise(s)
    ignore_phrases:
      - "nouvel an chinois"   # 零售行銷的檔期，不是國際業務
      - "chinese new year"
      - "cle anglaise"        # clé anglaise＝扳手

exclude_title:
  - "stage"
  - "stagiaire"
  - "alternance"
  - "alternant"
  - "alternante"
  - "apprenti"
  - "apprentissage"
  - "internship"
  # 採購職：法文職缺常寫成「Acheteur / Chef de Produit」，是採購不是行銷
  - "acheteur"
  - "acheteuse"

# 硬性排除（整字比對）：實習／建教的縮寫寫法，例如「Stg - Assistant...」「Alt - Chargé...」。
# 這些要整字比對，不能像 exclude_title 那樣用子字串——"alt" 會誤殺一堆正常字。
exclude_title_abbrev:
  - "stg"
  - "alt"
  - "stag"
  - "appr"   # 不要用 "app"：會誤殺 App Marketing Manager 這類正當職缺

# 硬性排除：職稱明顯針對其他國家市場（法國公司常替海外市場開缺、掛在巴黎辦公室下，
# 會騙過來源端的國家過濾；職稱含非法國國旗 emoji 也會被程式自動排除）
