name: Daily job scrape

on:
  schedule:
    # GitHub 的 cron 只吃 UTC，巴黎會換日光節約時間，所以每個時段排兩條、
    # 再由 gate 步驟挑出當下這一季正確的那條（另一條會被跳過）。
    # 一天兩輪：中午收早上新上架的，傍晚收下午新上架的。
    # 實際觸發可能延遲 10–30 分鐘（GitHub 的已知行為）。
    - cron: "0 10 * * *"   # 夏令 CEST(UTC+2) 的巴黎中午
    - cron: "0 11 * * *"   # 冬令 CET(UTC+1)  的巴黎中午
    - cron: "0 17 * * *"   # 夏令 CEST(UTC+2) 的巴黎 19:00
    - cron: "0 18 * * *"   # 冬令 CET(UTC+1)  的巴黎 19:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 來源變多、每詞抓 100 筆之後，30 分鐘會卡在邊緣
    steps:
      - name: Gate — 只在對應當季時區的那兩條 cron 上執行
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動觸發 — 照常執行"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 比對排程本身而不是當下時鐘，這樣就算 GitHub 延遲觸發也不會誤判
          offset=$(TZ=Europe/Paris date +%z)
          if [ "$offset" = "+0200" ]; then
            noon="0 10 * * *"; evening="0 17 * * *"
          else
            noon="0 11 * * *"; evening="0 18 * * *"
          fi
          got="${{ github.event.schedule }}"
          case "$got" in
            "$noon")    slot="中午" ;;
            "$evening") slot="傍晚" ;;
            *)          slot="" ;;
          esac
          if [ -n "$slot" ]; then
            echo "巴黎時區 $offset，本次排程 '$got' 對應$slot那輪 — 執行"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "巴黎時區 $offset，本次排程 '$got' 不屬於當季時段 — 跳過"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Run scraper
        if: steps.gate.outputs.run == 'true'
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          HOURS_OLD: "72"
          RESULTS_PER_TERM: "100"
        run: python -m scraper.main

      - name: Commit updated jobs.json
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "jos-chasse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/jobs.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: daily scrape $(TZ=Europe/Paris date +%F)"
          git push
